# Every 6 hours, rebuild the StormSense Latest pages (Tidewatch charts as
# placeholders for now) at fixed paths and deploy them to GitHub Pages.
# Nothing is committed or archived; each deploy replaces the last.
name: Publish StormSense Latest

on:
  schedule:
    - cron: "20 0,6,12,18 * * *"  # keep SCHEDULE in publish.py in step
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r styler/requirements.txt
      - name: Fetch, style and lay out the pages
        run: python publish.py site work 2>&1 | tee build_log.txt; cp build_log.txt site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
