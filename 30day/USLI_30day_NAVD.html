            logoEl = chart.renderer.image(cfg.logo, best[0], best[1], w, h).attr({opacity: 0.5, zIndex: 0}).add();
        };
        placeLogo();
        Highcharts.addEvent(chart, 'redraw', placeLogo);
    }
})();

});
</script>
